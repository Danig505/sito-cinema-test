<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinepattone - Dettaglio Film</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        🎬 <span class="brand-name">CINEPANETTONE</span>
      </div>
      <nav>
        <a href="/" class="nav-link">HOME</a>
      </nav>
    </header>

    <main class="container">
      <a href="/" class="back-link">← Torna ai film</a>
      <div id="movie-detail" class="movie-detail-container"></div>
      
      <h2 class="section-title" style="margin-top: 4rem;">PROSSIMI SPETTACOLI</h2>
      <div id="screenings-list" class="screenings-list"></div>
    </main>

     <div id="booking-modal" class="modal-overlay hidden">
       <div class="modal-content">
         <div class="modal-header">
           <div class="modal-icon">🎬</div>
           <h2 class="modal-title">PRENOTA IL TUO POSTO</h2>
           <p class="modal-subtitle">Compila il modulo per completare la prenotazione</p>
         </div>
         <form id="booking-form" class="booking-form">
           <div class="form-group">
             <label for="nome">NOME</label>
             <input type="text" id="nome" placeholder="es. Mario" required>
           </div>
           <div class="form-group">
             <label for="cognome">COGNOME</label>
             <input type="text" id="cognome" placeholder="es. Rossi" required>
           </div>
           <div class="form-group">
             <label for="email">EMAIL</label>
             <input type="email" id="email" placeholder="es. mario.rossi@email.com" required>
           </div>
           <button type="submit" class="btn-primary form-submit">Conferma prenotazione</button>
           <button type="button" id="close-modal-btn" class="btn-cancel">Annulla</button>
         </form>
         <div id="booking-feedback"></div>
       </div>
     </div>

    <script type="module" src="/src/dettaglio.ts"></script>
  </body>
</html>
